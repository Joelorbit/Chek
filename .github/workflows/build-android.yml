name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Chek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Compatible Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug & Release APK
        run: |
          cd android-client
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p output-apk
          cp android-client/app/build/outputs/apk/debug/app-debug.apk output-apk/chek-companion.apk
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chek-android-app
          path: output-apk/chek-companion.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Chek Companion App v1.0.0"
          body: |
            ## 📱 Chek Android Companion App

            Latest build of the Chek Ethiopian payment verification companion app.

            ### ✨ What's Included:
            - **CBE, Telebirr, Awash Bank, Bank of Abyssinia (BOA)** instant SMS/notification interception.
            - **On-Device Privacy Guard**: drops OTPs, 2FA, debit alerts, and personal SMS locally on the device.
            - **Odit-grade UI**: Hero Stats volume tracking, horizontal filter chips, tap-to-inspect bottom sheet.
            - **6-Digit Real-Time Pairing**: Instant handshake with Chek Cloud Server.

            ---
            ### 📥 Direct APK Download:
            Download **`chek-companion.apk`** below to install directly on your Android phone!
          files: output-apk/chek-companion.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
