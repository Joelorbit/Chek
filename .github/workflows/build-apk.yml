name: Build Chek Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Chek APK
        working-directory: ./android-client
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p build-outputs
          cp app/build/outputs/apk/debug/*.apk build-outputs/Chek-v1.0.apk || true

      - name: Upload Chek APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chek-APK
          path: |
            android-client/build-outputs/Chek-v1.0.apk
            android-client/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish Direct GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android-client/build-outputs/Chek-v1.0.apk
          name: Chek Android Companion App v1.0.0
          tag_name: v1.0.0
          body: |
            ## 🧾 Chek Android Companion App v1.0.0
            - 🔒 On-device privacy filtering for CBE & Telebirr payments
            - ⚡ Instant relay to webhooks and bots
            - 🎨 EyuTheme Dark/Light UI
          draft: false
          prerelease: false
